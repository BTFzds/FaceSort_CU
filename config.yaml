# FaceSort 配置文件 — 可按需修改

# 人脸匹配相似度阈值 (0~1，越高越严格，建议 0.40~0.60)
match_threshold: 0.45

# 人脸检测最小尺寸（像素）— 合照小人脸建议 20~30
min_face_size: 20

# 检测置信度阈值（越低越容易检出遮挡/侧脸，误检也会略增）
det_thresh: 0.35

# 检测输入尺寸，越大对小人脸越准但越慢（合照建议 640~960）
det_size: 800

# InsightFace 模型名称（首次运行自动下载）
model_name: buffalo_l

# 是否优先使用 GPU（需要 onnxruntime-gpu 和 CUDA）
use_gpu: true

# 扫描时使用的 CPU 工作进程数（0 = 自动）
scan_workers: 0

# 支持的图片扩展名
image_extensions:
  - .jpg
  - .jpeg
  - .png
  - .bmp
  - .webp
  - .tif
  - .tiff
  - .heic

# 本地数据库路径（相对于项目根目录）
database_path: data/facesort.db

# 默认导出目录
export_dir: output
